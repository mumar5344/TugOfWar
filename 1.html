<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Tug-of-War - Online P2P</title>
    
    <!-- PeerJS CDN for zero-setup P2P multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }
        h1 { margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 2px; color: #38bdf8; font-size: clamp(1.4rem, 4vw, 2rem); text-align: center; }
        p { color: #94a3b8; margin: 0 0 15px 0; font-size: clamp(0.8rem, 2vw, 0.95rem); text-align: center; }
        
        .game-container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; }

        .menu-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
            width: 100%;
        }
        .btn:hover { background: #0ea5e9; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #475569; color: #f8fafc; }
        .btn-secondary:hover { background: #64748b; }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-weight: bold;
            margin-bottom: 10px;
        }
        .player1 { color: #38bdf8; }
        .player2 { color: #facc15; }

        #status-msg {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: bold;
            margin: 10px 0;
            min-height: 30px;
        }

        .track {
            position: relative;
            height: 26px;
            background: #0f172a;
            border-radius: 13px;
            margin: 20px 0;
            border: 2px solid #475569;
        }

        .flag {
            position: absolute;
            top: -5px;
            left: 50%;
            width: 10px;
            height: 32px;
            background: #f43f5e;
            border-radius: 5px;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #f43f5e;
        }

        .mash-btn {
            width: 100%;
            padding: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #0284c7;
            color: #f8fafc;
            box-shadow: 0 6px 0 #0369a1;
            transition: transform 0.05s;
            touch-action: manipulation;
        }
        .mash-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0369a1;
        }

        .room-code-display {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #38bdf8;
            letter-spacing: 2px;
            margin: 10px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Neon Tug-of-War</h1>

        <!-- SCREEN 1: MENU -->
        <div id="menu-screen" class="screen active">
            <p>P2P Direct Online Multiplayer</p>
            <div class="menu-group">
                <button class="btn" onclick="createRoom()">Create Room (Host)</button>
            </div>
            <div style="margin: 10px 0; color: #64748b; font-size: 0.9rem;">— OR JOIN —</div>
            <div class="menu-group">
                <input type="text" id="room-input" placeholder="Paste Room Code Here">
                <button class="btn btn-secondary" onclick="joinRoom()">Join Room</button>
            </div>
        </div>

        <!-- SCREEN 2: LOBBY -->
        <div id="lobby-screen" class="screen">
            <p>Share this code with your opponent:</p>
            <div class="room-code-display" id="display-code">Generating...</div>
            <div id="connection-status" style="margin: 15px 0; font-weight: bold; color: #facc15;">Waiting for opponent to connect...</div>
        </div>

        <!-- SCREEN 3: GAME -->
        <div id="game-screen" class="screen">
            <div class="scoreboard">
                <span class="player1">P1 (Blue): <span id="p1-score">0</span></span>
                <span class="player2">P2 (Yellow): <span id="p2-score">0</span></span>
            </div>

            <div id="status-msg">FIGHT!</div>

            <div class="track">
                <div class="flag" id="flag"></div>
            </div>

            <div style="margin-top: 15px;">
                <button class="mash-btn" id="mash-btn" onclick="mashButton()">TAP / MASH FAST!</button>
            </div>
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 10px;">You can also press Spacebar or Enter.</p>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let role = null; // 'p1' (host) or 'p2' (guest)
        let position = 50;
        let p1Wins = 0;
        let p2Wins = 0;
        let gameActive = false;

        const flagElem = document.getElementById('flag');
        const statusMsg = document.getElementById('status-msg');
        const p1ScoreElem = document.getElementById('p1-score');
        const p2ScoreElem = document.getElementById('p2-score');
        const mashBtn = document.getElementById('mash-btn');

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function createRoom() {
            role = 'p1';
            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('display-code').textContent = id;
                showScreen('lobby-screen');
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                showScreen('game-screen');
                startGame();
            });
        }

        function joinRoom() {
            const code = document.getElementById('room-input').value.trim();
            if (!code) {
                alert('Please enter a room code');
                return;
            }

            role = 'p2';
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
                showScreen('game-screen');
                statusMsg.textContent = "Connected! Waiting for host...";
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'STATE') {
                    position = data.position;
                    p1Wins = data.p1Wins;
                    p2Wins = data.p2Wins;
                    updateUI();
                } else if (data.type === 'WIN') {
                    position = data.winner === 'p1' ? 0 : 100;
                    if (data.winner === 'p1') p1Wins++; else p2Wins++;
                    updateUI();
                    endGame(data.winner === 'p1' ? "Player 1 Wins! 💙" : "Player 2 Wins! 💛");
                }
            });

            conn.on('open', () => {
                if (role === 'p2') {
                    gameActive = true;
                    statusMsg.textContent = "FIGHT!";
                }
            });
        }

        function startGame() {
            gameActive = true;
            position = 50;
            updateUI();
            statusMsg.textContent = "FIGHT!";
        }

        function updateUI() {
            flagElem.style.left = position + '%';
            p1ScoreElem.textContent = p1Wins;
            p2ScoreElem.textContent = p2Wins;
        }

        function mashButton() {
            if (!gameActive) return;

            if (role === 'p1') {
                position -= 2;
            } else {
                position += 2;
            }

            updateUI();

            if (position <= 0) {
                position = 0;
                p1Wins++;
                updateUI();
                endGame("Player 1 Wins! 💙");
                if (conn && conn.open) conn.send({ type: 'WIN', winner: 'p1' });
                setTimeout(resetRound, 2500);
            } else if (position >= 100) {
                position = 100;
                p2Wins++;
                updateUI();
                endGame("Player 2 Wins! 💛");
                if (conn && conn.open) conn.send({ type: 'WIN', winner: 'p2' });
                setTimeout(resetRound, 2500);
            } else {
                if (conn && conn.open) {
                    conn.send({ type: 'STATE', position, p1Wins, p2Wins });
                }
            }
        }

        function resetRound() {
            position = 50;
            updateUI();
            gameActive = true;
            statusMsg.textContent = "FIGHT!";
        }

        function endGame(msg) {
            gameActive = false;
            statusMsg.textContent = msg;
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                mashButton();
            }
        });

        // Style button color based on role
        mashBtn.style.background = '#0284c7';
    </script>
</body>
</html>
